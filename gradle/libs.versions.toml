# Single source of truth for versions across all modules.
# Library versions that the Spring Boot BOM already manages are deliberately NOT listed here.

[versions]
kotlin = "2.1.21"
springBoot = "3.5.0"
springDependencyManagement = "1.1.7"
# Not managed by the Spring Boot BOM, so it is pinned here.
wiremock = "3.13.1"

[libraries]
# The shaded "standalone" build: WireMock embeds its own Jetty, and the unshaded artifact drags a
# second Jetty and servlet API onto the test classpath next to Spring Boot's Tomcat.
wiremock = { module = "org.wiremock:wiremock-standalone", version.ref = "wiremock" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-spring = { id = "org.jetbrains.kotlin.plugin.spring", version.ref = "kotlin" }
kotlin-jpa = { id = "org.jetbrains.kotlin.plugin.jpa", version.ref = "kotlin" }
spring-boot = { id = "org.springframework.boot", version.ref = "springBoot" }
spring-dependency-management = { id = "io.spring.dependency-management", version.ref = "springDependencyManagement" }
