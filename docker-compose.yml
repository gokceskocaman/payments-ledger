# Two ways to run this:
#
#   docker compose up -d                          infrastructure only -- the default. Run the services
#                                                 on the host with ./gradlew bootRun, which keeps the
#                                                 edit/restart/debug loop fast.
#   docker compose --profile apps up -d --build   the whole stack in containers, as a deployment
#                                                 rehearsal: the services then reach Postgres and
#                                                 Kafka by service name rather than via localhost.
#
# The services are behind a profile so the first command stays fast and does not build images.
name: payments-ledger

services:
  postgres-account:
    image: postgres:16-alpine
    container_name: pl-postgres-account
    environment:
      POSTGRES_DB: account
      POSTGRES_USER: account
      POSTGRES_PASSWORD: account
    # Non-default host ports so both databases can run at once and neither clashes
    # with a Postgres already installed on the machine.
    ports:
      - "5433:5432"
    volumes:
      - postgres-account-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U account -d account"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-payment:
    image: postgres:16-alpine
    container_name: pl-postgres-payment
    environment:
      POSTGRES_DB: payment
      POSTGRES_USER: payment
      POSTGRES_PASSWORD: payment
    ports:
      - "5434:5432"
    volumes:
      - postgres-payment-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payment -d payment"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    # Official Apache image, single node in KRaft mode: the broker is its own controller,
    # no ZooKeeper container.
    image: apache/kafka:3.9.0
    container_name: pl-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # Two client listeners: EXTERNAL for the services running on the host (localhost:9092),
      # INTERNAL for anything that later runs inside this compose network (kafka:19092).
      KAFKA_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://0.0.0.0:9092,CONTROLLER://kafka:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Topics are declared explicitly in code later; a typo must not silently create a topic.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      # Fixed cluster id so the persisted log directory still matches after a restart.
      CLUSTER_ID: 5L6g3nShT-eMCtK--X86sw
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  # ---------------------------------------------------------------------------------------------------
  # The services themselves, only with --profile apps.
  # ---------------------------------------------------------------------------------------------------

  account-service:
    profiles: ["apps"]
    build:
      # The repository root, because the Gradle build is multi-module and the Dockerfile needs it all.
      context: .
      dockerfile: account-service/Dockerfile
    container_name: pl-account-service
    depends_on:
      postgres-account:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      # Inside the compose network the database is reachable by service name on its own port, not on
      # the host port mapping.
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-account:5432/account
      SPRING_DATASOURCE_USERNAME: account
      SPRING_DATASOURCE_PASSWORD: account
      # The INTERNAL listener, which is why the broker advertises two of them.
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      JWT_HMAC_SECRET: dev-only-hs256-secret-not-for-production-0123456789
      JWT_ISSUER: payments-ledger-dev
    ports:
      - "8081:8081"

  payment-service:
    profiles: ["apps"]
    build:
      context: .
      dockerfile: payment-service/Dockerfile
    container_name: pl-payment-service
    depends_on:
      postgres-payment:
        condition: service_healthy
      kafka:
        condition: service_healthy
      account-service:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-payment:5432/payment
      SPRING_DATASOURCE_USERNAME: payment
      SPRING_DATASOURCE_PASSWORD: payment
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      ACCOUNT_SERVICE_BASE_URL: http://account-service:8081
      # Must match account-service: the service token payment-service mints has to verify there.
      JWT_HMAC_SECRET: dev-only-hs256-secret-not-for-production-0123456789
      JWT_ISSUER: payments-ledger-dev
    ports:
      - "8082:8082"

volumes:
  postgres-account-data:
  postgres-payment-data:
  kafka-data:
