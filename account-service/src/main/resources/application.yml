server:
  port: 8081

spring:
  application:
    name: account-service

  # Own database, own credentials. account-service must never read payment-service's tables.
  datasource:
    url: jdbc:postgresql://localhost:5433/account
    username: account
    password: account

  jpa:
    # Flyway owns the schema; Hibernate is only allowed to check that it matches the entities.
    hibernate:
      ddl-auto: validate
    # No lazy loading in the web layer: every query must be inside a service transaction.
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: account-service
      # Read the topic from the beginning the first time this group appears, so events published
      # before the consumer existed are not silently skipped.
      auto-offset-reset: earliest
      # Offsets are committed by the listener container after the handler returns, never by a timer
      # in the background: a commit must mean "this record was processed", not "this record was read".
      enable-auto-commit: false
      properties:
        # payments.events belongs to payment-service, so it may not exist when this service starts.
        # The default refresh is five minutes, which means a consumer that boots first would ignore
        # the topic for five minutes after it appears. In production topics are created by
        # infrastructure rather than by whichever service happens to start first.
        metadata.max.age.ms: 10000
    listener:
      # Commit after every record rather than every batch. It costs one commit per record and buys
      # the smallest possible redelivery window when the consumer dies mid-batch.
      ack-mode: record

  data:
    web:
      pageable:
        default-page-size: 20
        # Without a cap, ?size=1000000 is a denial-of-service request against the ledger.
        max-page-size: 100

security:
  jwt:
    # DEV ONLY. A symmetric secret: whoever holds it can mint tokens, not just verify them. It lives
    # here so the project can be cloned and run; production replaces this whole block with
    # spring.security.oauth2.resourceserver.jwt.jwk-set-uri and holds no signing material at all.
    hmac-secret: ${JWT_HMAC_SECRET:dev-only-hs256-secret-not-for-production-0123456789}
    issuer: ${JWT_ISSUER:payments-ledger-dev}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
  health:
    db:
      enabled: true

payment-events:
  topic: payments.events
  group-id: account-service
  dlt-topic: payments.events.DLT
  dlt-partitions: 3
  dlt-replicas: 1
  max-retries: 3
  retry-initial-interval: 200ms
  retry-multiplier: 2.0
  retry-max-interval: 2s

logging:
  level:
    org.flywaydb: info
